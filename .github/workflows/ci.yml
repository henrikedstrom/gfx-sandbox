name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: "1.4.335.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Native builds for Windows, macOS, and Linux
  native:
    name: Native (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      # Platform-specific Vulkan SDK installation
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          version="${{ env.VULKAN_SDK_VERSION }}"
          archivePath="$RUNNER_TEMP/vulkan-sdk-linux.tar.xz"
          extractRoot="$RUNNER_TEMP/vulkan-sdk-linux"
          sdkArchiveUrl="https://sdk.lunarg.com/sdk/download/$version/linux/vulkansdk-linux-x86_64-$version.tar.xz?Human=true"

          echo "Downloading Vulkan SDK $version..."
          curl -L --fail -o "$archivePath" "$sdkArchiveUrl"

          echo "Extracting Vulkan SDK archive..."
          mkdir -p "$extractRoot"
          tar -xJf "$archivePath" -C "$extractRoot"

          sdkPath="$(echo "$extractRoot"/"$version"/x86_64)"
          if [ ! -d "$sdkPath" ]; then
            echo "ERROR: Expected Vulkan SDK path not found: $sdkPath"
            ls -la "$extractRoot" || true
            exit 1
          fi

          # Verify required files for CMake's Vulkan shaderc_combined component.
          if [ ! -f "$sdkPath/include/vulkan/vulkan.h" ]; then
            echo "ERROR: Vulkan headers not found in $sdkPath/include/vulkan"
            exit 1
          fi
          if [ ! -f "$sdkPath/lib/libshaderc_combined.a" ] && [ ! -f "$sdkPath/lib/libshaderc_combined.so" ]; then
            echo "ERROR: shaderc_combined library not found in $sdkPath/lib"
            ls -la "$sdkPath/lib" || true
            exit 1
          fi

          echo "Vulkan SDK installation verified successfully"
          echo "VULKAN_SDK=$sdkPath" >> "$GITHUB_ENV"
          echo "$sdkPath/bin" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ env.VULKAN_SDK_VERSION }}"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe?Human=true"
          $installerPath = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          
          Write-Host "Downloading Vulkan SDK $version..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          
          Write-Host "Installing Vulkan SDK with debug components..."
          # Install core SDK + debug component (for shaderc_combinedd.lib)
          $process = Start-Process -FilePath $installerPath `
            -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install", "com.lunarg.vulkan.debug" `
            -Wait -PassThru -NoNewWindow
          
          if ($process.ExitCode -ne 0) {
            Write-Error "Vulkan SDK installation failed with exit code $($process.ExitCode)"
            exit 1
          }
          
          $sdkPath = "C:\VulkanSDK\$version"
          Write-Host "Vulkan SDK installed to: $sdkPath"
          
          # Verify installation - headers
          if (-not (Test-Path "$sdkPath\Include\vulkan\vulkan.h")) {
            Write-Error "Vulkan SDK installation verification failed - headers not found"
            Get-ChildItem "C:\VulkanSDK\" -ErrorAction SilentlyContinue | Format-Table
            exit 1
          }
          
          # Verify debug library exists
          if (-not (Test-Path "$sdkPath\Lib\shaderc_combinedd.lib")) {
            Write-Error "Debug shaderc library not found - debug component may not have installed"
            Get-ChildItem "$sdkPath\Lib\*shaderc*" -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }
          
          Write-Host "Vulkan SDK installation verified (including debug libraries)"
          
          # Set environment for subsequent steps
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK (macOS)
        if: runner.os == 'macOS'
        run: |
          version="${{ env.VULKAN_SDK_VERSION }}"
          zipUrl="https://sdk.lunarg.com/sdk/download/$version/mac/vulkansdk-macos-$version.zip?Human=true"
          zipPath="$RUNNER_TEMP/vulkan-sdk.zip"
          extractPath="$RUNNER_TEMP/vulkan-sdk"
          
          echo "Downloading Vulkan SDK $version..."
          curl -L --fail -o "$zipPath" "$zipUrl"
          
          echo "Extracting ZIP..."
          unzip -q "$zipPath" -d "$extractPath"
          
          installerApp="$extractPath/vulkansdk-macOS-$version.app"
          
          if [ ! -d "$installerApp" ]; then
            echo "Looking for installer app..."
            find "$extractPath" -name "*.app" -type d
            installerApp=$(find "$extractPath" -name "vulkansdk*.app" -type d | head -1)
          fi
          
          echo "Installing Vulkan SDK from: $installerApp"
          sudo "$installerApp/Contents/MacOS/vulkansdk-macOS-$version" \
            --accept-licenses --default-answer --confirm-command install
          
          sdkPath="$HOME/VulkanSDK/$version/macOS"
          echo "Vulkan SDK installed to: $sdkPath"
          
          # Verify installation
          if [ ! -f "$sdkPath/include/vulkan/vulkan.h" ]; then
            echo "ERROR: Vulkan SDK installation verification failed - headers not found"
            echo "Checking what was installed:"
            ls -la "$HOME/VulkanSDK/" || true
            ls -la "$HOME/VulkanSDK/$version/" || true
            exit 1
          fi
          
          echo "Vulkan SDK installation verified successfully"
          
          # Set environment for subsequent steps
          echo "VULKAN_SDK=$sdkPath" >> $GITHUB_ENV
          echo "$sdkPath/bin" >> $GITHUB_PATH

      - name: Cache CMake dependencies (FetchContent)
        uses: actions/cache@v5
        with:
          path: build-${{ matrix.build_type }}/_deps
          key: ${{ runner.os }}-cmake-deps-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-${{ matrix.build_type }}-

      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_WEBGPU=ON -DENABLE_VULKAN=ON -S . -B build-${{ matrix.build_type }}

      - name: Build
        run: cmake --build build-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel 4

  # Web build using Emscripten (only on Linux, output is platform-independent)
  web:
    name: Web (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Read Emscripten version
        shell: bash
        run: echo "EMSDK_VERSION=$(tr -d '\r\n' < .emscripten-version)" >> "$GITHUB_ENV"

      - name: Install Emscripten
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

          # Export paths for subsequent steps in this job.
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Verify Emscripten tools
        shell: bash
        run: |
          set -euxo pipefail
          emcc --version
          command -v emcmake
          emcmake cmake --version

      - name: Cache CMake dependencies (FetchContent)
        uses: actions/cache@v5
        with:
          path: build-web-${{ matrix.build_type }}/_deps
          key: web-cmake-deps-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '.emscripten-version') }}
          restore-keys: |
            web-cmake-deps-${{ matrix.build_type }}-

      - name: Configure CMake with Emscripten
        run: emcmake cmake -S . -B build-web-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_WEBGPU=ON -DENABLE_VULKAN=OFF

      - name: Build
        run: cmake --build build-web-${{ matrix.build_type }} --parallel 4
